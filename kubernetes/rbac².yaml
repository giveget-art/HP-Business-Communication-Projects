apiVersion: v1
kind: ServiceAccount
metadata:
  name: hp-communication-app
  namespace: hp-communication
  labels:
    app.kubernetes.io/name: hp-communication-app
    app.kubernetes.io/managed-by: copilot-chat
# Disable token unless the app actually needs to call the API server with the SA token.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hp-communication-ui
  namespace: hp-communication
  labels:
    app.kubernetes.io/name: hp-communication-ui
    app.kubernetes.io/managed-by: copilot-chat
# UI typically doesn't need a service account token — keep it disabled.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hp-communication-role
  namespace: hp-communication
  labels:
    app.kubernetes.io/name: hp-communication-role
    app.kubernetes.io/managed-by: copilot-chat
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  # Restrict to specific configmap(s); replace with actual names. Remove resourceNames to allow all configmaps.
  resourceNames: ["hp-communication-config"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  # Restrict to specific secret(s); replace with actual names. Remove resourceNames to allow all secrets.
  resourceNames: ["hp-communication-credentials"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hp-communication-app-binding
  namespace: hp-communication
 8s.io
  kind: Role
  name: hp-communication-role
subjects:
- kind: ServiceAccount
  name: hp-communication-app
  namespace: hp-communication
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hp-communication-ui-binding
  namespace: hp-communication
  labels:
    app.kubernetes.io/name: hp-communication-ui-binding
    app.kubernetes.io/managed-by: copilot-chat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hp-communication-role
subjects:
- kind: ServiceAccount
  name: hp-communication-ui
  namespace: hp-communication

Notes:
- Replace the resourceNames placeholders (hp-communication-config, hp-communication-credentials) with the actual configmap/secret names your workloads need. If you must allow access to multiple or dynamic names, remove resourceNames and scope via labels/naming conventions as appropriate.
- If either ServiceAccount actually needs a mounted token (e.g., for in-cluster API calls), set automountServiceAccountToken: true for that SA.